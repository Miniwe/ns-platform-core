name: Publish Package


on:
  workflow_run:
    workflows: ["CI"] # Должно строго совпадать с name в ci.yml
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    # КРИТИЧЕСКИ ВАЖНО: запускать только при успешном (success) результате CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}


    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@miniwe'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests & Build
        run: |
          npm run clean
          npm run lint
          npm run test:dependencies
          npm run test
          npm version patch --no-git-tag-version
          npm run build

      - name: Publish to GitHub Packages
        # --ignore-scripts: без него npm publish зовёт prepublishOnly,
        # а тот начинается с rimraf package-lock.json + node_modules и
        # npm install набело. Пакет держит decimal.js, @nestjs/passport
        # и ещё дюжину зависимостей как optional peerDependencies — npm
        # ci (шаг выше) ставит их по lock-файлу, а install без лока их
        # не трогает вовсе. test:all внутри prepublishOnly падает на
        # «Cannot find module». Проверки и так уже прошли этим же job'ом
        # строками выше — повторный прогон не нужен.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}